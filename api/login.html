<!DOCTYPE html>
<html>
<head>
    <title>Secure Access Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1d33;
            color: white;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 50px auto;
            background: #122544;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.3);
        }

        .logo {
            width: 120px;
            margin: 10px auto;
            display: block;
        }

        h1, h2 {
            margin: 20px 0;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-primary {
            background: #163a67;
            color: white;
        }

        .btn-danger {
            background: #8b1e1e;
            color: white;
        }

        .btn-success {
            background: #2e8b57;
            color: white;
        }

        .link {
            color: #bbb;
            font-size: 14px;
            display: block;
            margin-top: 8px;
            text-decoration: none;
        }
        .link:hover {
            color: white;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu a {
            background: #163a67;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        .menu a:hover {
            background: #1d4b85;
        }
        
        
        .login-options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .login-option {
            width: 48%;
            padding: 15px;
            background: #163a67;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .login-option.active {
            background: #1d4b85;
            border: 1px solid #4CAF50;
        }
        
        .login-section {
            display: none;
        }
        
        .login-section.active {
            display: block;
        }
        
        #video {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        #status {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
        }
        
        .success { 
            color: #155724; 
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
        
        .error { 
            color: #721c24; 
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        
        .info { 
            color: #0c5460; 
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
        }
        
        .user-info {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 5px;
            border: 1px solid #c8e6c9;
            color: #333;
        }
        
        .user-info h3 {
            margin-top: 0;
            color: #2e7d32;
        }
        
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Secure Access System</h1>
        <h2>Login Portal</h2>
        
        <div class="login-options">
            <div class="login-option active" id="facialOption" onclick="switchLoginMethod('facial')">
                <h3>Facial Recognition</h3>
                <p>Login using your facial biometrics</p>
            </div>
            <div class="login-option" id="manualOption" onclick="switchLoginMethod('manual')">
                <h3>Manual Login</h3>
                <p>Login with badge ID</p>
            </div>
        </div>
        
        
        <div class="login-section active" id="facialLogin">
            <video id="video" autoplay></video>
            
            <button id="verifyBtn" class="btn-success">Verify Identity</button>
            
            <div id="status" class="info">Position your face in the camera and click 'Verify Identity'</div>
            
            <div id="userInfo" class="user-info" style="display: none;">
                <h3>Login Successful!</h3>
                <p><strong>Name:</strong> <span id="userName"></span></p>
                <p><strong>Badge ID:</strong> <span id="userBadgeId"></span></p>
                <p><strong>Rank:</strong> <span id="userRank"></span></p>
                <p><strong>Confidence:</strong> <span id="confidence"></span></p>
            </div>
        </div>
        
        
        <div class="login-section" id="manualLogin">
            <div class="form-group">
                <label for="badge_id">Badge ID:</label>
                <input type="password" id="manualBadgeId" name="badge_id" pattern="\d{5}" title="5-digit code" required>
                
            </div>
            
            <button id="manualLoginBtn" class="btn-primary">Login</button>
            
            <div id="manualStatus" class="info">Enter your badge ID</div>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="/" class="link">Register New User</a>
        </div>
    </div>
    
    <script>
        
        const facialOption = document.getElementById('facialOption');
        const manualOption = document.getElementById('manualOption');
        const facialLogin = document.getElementById('facialLogin');
        const manualLogin = document.getElementById('manualLogin');
        const video = document.getElementById('video');
        const verifyBtn = document.getElementById('verifyBtn');
        const manualLoginBtn = document.getElementById('manualLoginBtn');
        const status = document.getElementById('status');
        const manualStatus = document.getElementById('manualStatus');
        const userInfo = document.getElementById('userInfo');
        
        // Switch between login methods
        function switchLoginMethod(method) {
            if (method === 'facial') {
                facialOption.classList.add('active');
                manualOption.classList.remove('active');
                facialLogin.classList.add('active');
                manualLogin.classList.remove('active');
            } else {
                facialOption.classList.remove('active');
                manualOption.classList.add('active');
                facialLogin.classList.remove('active');
                manualLogin.classList.add('active');
            }
        }
        
        // Access the camera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(error => {
                console.error('Error accessing camera:', error);
                status.textContent = 'Error accessing camera. Please check permissions or use manual login.';
                status.className = 'error';
                verifyBtn.disabled = true;
            });
        
        
        verifyBtn.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert to base64
            const imageData = canvas.toDataURL('image/jpeg');
            
            // Update status
            status.textContent = 'Verifying identity...';
            status.className = 'info';
            
            // Send to API
            fetch('http://localhost:5000/verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    image: imageData
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (data.verified) {
                        status.textContent = 'Identity verified successfully!';
                        status.className = 'success';
                        
                        // Display user information
                        document.getElementById('userName').textContent = data.user.name;
                        document.getElementById('userBadgeId').textContent = data.user.badge_id;
                        document.getElementById('userRank').textContent = data.user.rank;
                        userInfo.style.display = 'block';
                        
                        // Generate token for PHP authentication
                        fetch('http://localhost:5000/generate-token', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                badge_id: data.user.badge_id,
                                name: data.user.name,
                                rank: data.user.rank,
                                role: data.user.role || 'officer'
                            })
                        })
                        .then(response => response.json())
                        .then(tokenData => {
                            if (tokenData.success) {
                                // Redirect to PHP login with token
                                window.location.href = tokenData.redirect_url;
                            } else {
                                status.textContent = 'Error generating token: ' + (tokenData.message || 'Unknown error');
                                status.className = 'error';
                            }
                        })
                        .catch(error => {
                            console.error('Token generation error:', error);
                            status.textContent = 'Error generating login token';
                            status.className = 'error';
                        });
                    } else {
                        status.textContent = data.message || 'User not recognized';
                        status.className = 'error';
                    }
                } else {
                    status.textContent = 'Error: ' + data.message;
                    status.className = 'error';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                status.textContent = 'Error verifying identity';
                status.className = 'error';
                userInfo.style.display = 'none';
            });
        });
        
        
        manualLoginBtn.addEventListener('click', () => {
            const badgeId = document.getElementById('manualBadgeId').value;
            
            if (!badgeId) {
                manualStatus.textContent = 'Please enter your badge ID';
                manualStatus.className = 'error';
                return;
            }
            
            // Validate badge ID format (5 digits, not all zeros)
            if (!/^\d{5}$/.test(badgeId) || badgeId === '00000') {
                manualStatus.textContent = 'Please enter a valid 5-digit badge ID';
                manualStatus.className = 'error';
                return;
            }
            
            manualStatus.textContent = 'Verifying badge ID...';
            manualStatus.className = 'info';
            
            
            fetch('http://localhost:5000/manual-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    badge_id: badgeId
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (data.verified) {
                        manualStatus.textContent = 'Login successful!';
                        manualStatus.className = 'success';
                        
                        // Display user information
                        document.getElementById('userName').textContent = data.user.name;
                        document.getElementById('userBadgeId').textContent = data.user.badge_id;
                        document.getElementById('userRank').textContent = data.user.rank;
                        userInfo.style.display = 'block';
                        
                        // Generate token for PHP authentication
                        fetch('http://localhost:5000/generate-token', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                badge_id: data.user.badge_id,
                                name: data.user.name,
                                rank: data.user.rank,
                                role: data.user.role || 'officer'
                            })
                        })
                        .then(response => response.json())
                        .then(tokenData => {
                            if (tokenData.success) {
                                // Redirect to PHP login with token
                                window.location.href = tokenData.redirect_url;
                            } else {
                                manualStatus.textContent = 'Error generating token: ' + (tokenData.message || 'Unknown error');
                                manualStatus.className = 'error';
                            }
                        })
                        .catch(error => {
                            console.error('Token generation error:', error);
                            manualStatus.textContent = 'Error generating login token';
                            manualStatus.className = 'error';
                        });
                    } else {
                        manualStatus.textContent = data.message || 'Badge ID not recognized';
                        manualStatus.className = 'error';
                    }
                } else {
                    manualStatus.textContent = 'Error: ' + data.message;
                    manualStatus.className = 'error';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                manualStatus.textContent = 'Error during login';
                manualStatus.className = 'error';
            });
        });
    </script>
</body>
</html>
