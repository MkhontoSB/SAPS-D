<!DOCTYPE html>
<html>
<head>
    <title>Secure Access Login</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
    
</head>
<body>
    <div class="container">
        <h1>DOCKSAP</h1>
        <h2>Login Portal</h2>
        
        <div class="login-options">
            <div class="login-option active" id="facialOption" onclick="switchLoginMethod('facial')">
                <h3>Facial Recognition</h3>
                <p>Login using your facial biometrics</p>
            </div>
            <div class="login-option" id="manualOption" onclick="switchLoginMethod('manual')">
                <h3>Manual Login</h3>
                <p>Login with badge ID</p>
            </div>
        </div>
        
        
        <div class="login-section active" id="facialLogin">
            <video id="video" autoplay></video>
            
            <button id="verifyBtn" class="btn-success">Verify Identity</button>
            
            <div id="status" class="info">Position your face in the camera and click 'Verify Identity'</div>
            
            <div id="userInfo" class="user-info" style="display: none;">
                <h3>Login Successful!</h3>
                <p><strong>Name:</strong> <span id="userName"></span></p>
                <p><strong>Badge ID:</strong> <span id="userBadgeId"></span></p>
                <p><strong>Rank:</strong> <span id="userRank"></span></p>
                <p><strong>Confidence:</strong> <span id="confidence"></span></p>
            </div>
        </div>
        
        
        <div class="login-section" id="manualLogin">
            <div class="form-group">
                <label for="badge_id">Badge ID:</label>
                <input type="password" name="badge_id" id="badge_id" placeholder="Enter your 5-digit badge ID" required maxlength="5">
                <span class="password-toggle" onclick="togglePasswordVisibility()"></span>
                
            </div>
            
            <button id="manualLoginBtn" class="btn-primary">Login</button>
            
            <div id="manualStatus" class="info">Enter your badge ID</div>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="Registration.html" class="link">Register New User</a>
        </div>
    </div>
    
    
</body>
</html>
